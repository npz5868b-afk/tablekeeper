<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../src/styles.css"><style>html,body{margin:0;min-height:100%;background:#030403;color:#eee;font-family:Arial,sans-serif}.visual-pass{min-height:100vh;display:grid;place-items:center}.authoritative-pass{width:min(520px,calc(100% - 40px));padding:42px;box-sizing:border-box;background:linear-gradient(145deg,#171711,#080906);border:1px solid #80652f;border-radius:28px}.authoritative-pass h2{font:42px Georgia}.authoritative-pass dl{display:grid;grid-template-columns:1fr 1fr;gap:20px}.authoritative-pass dd{margin:5px 0;color:#e5cf98}</style></head><body><main id="app"></main><script type="module">import{guestDiningMapMarkup,guestDiningMapModel}from'../src/guest-dining-map.js';const q=new URLSearchParams(location.search),count=Number(q.get('count')||2),venue=q.get('venue')||'Kumo Dining',mobile=q.get('view')==='map';const tables=Array.from({length:count},(_,i)=>({tableKey:'opaque-'+i,label:'Table '+String(i+1).padStart(2,'0'),capacity:[2,4,4,6,8][i%5],isYours:i===Math.min(1,count-1)}));const projection={status:'CONFIRMED',allocationEstablished:true,venueName:venue,partySize:2,timeRange:{start:'2026-10-05T12:00:00.000Z'},tables};app.innerHTML=mobile?`<div class="guest-dining-map"><button class="guest-map-close">×</button><div data-guest-map-content>${guestDiningMapMarkup(guestDiningMapModel(projection),{bookingReference:'TK-'+venue.split(' ')[0].toUpperCase()+'-2FFE',timeLabel:'5 Oct 2026, 8:00 PM'})}</div></div>`:`<div class="visual-pass"><article class="authoritative-pass"><small>TABLEKEEPER · DINING PASS</small><b>CONFIRMED</b><h2>${venue}</h2><dl><div><dt>Booking reference</dt><dd>TK-${venue.split(' ')[0].toUpperCase()}-2FFE</dd></div><div><dt>Party</dt><dd>2</dd></div><div><dt>Time</dt><dd>5 Oct 2026, 8:00 PM</dd></div></dl><button class="reservation-primary guest-map-action">VIEW YOUR TABLE</button></article></div>`;</script>
